<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District 8 Apartments</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading District 8 Apartments...</p>
    </div>

    <!-- Header -->
    <div class="header">
        <div>
            <h1>🏢 District 8 Apartments <span class="verified-badge">✓ Verified</span></h1>
            <div class="subtitle">Current Virginia 8th Congressional District apartment map</div>
        </div>
        <div class="header-stats">
            <div class="header-stat">
                <div class="num" id="stat-total">—</div>
                <div class="label">Complexes</div>
            </div>
            <div class="header-stat">
                <div class="num" id="stat-units">—</div>
                <div class="label">Est. Units</div>
            </div>
            <div class="header-stat">
                <div class="num" id="stat-voters">—</div>
                <div class="label">Est. Voters</div>
            </div>
            <div class="header-stat">
                <div class="num" id="stat-contacted">—</div>
                <div class="label">Contacted</div>
            </div>
            <div class="header-stat">
                <div class="num" id="stat-canvassed">—</div>
                <div class="label">Canvassed</div>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="map">🗺️ Map</div>
        <div class="tab" data-tab="list">📋 List <span class="count-badge" id="list-count"></span></div>
    </div>

    <!-- Map Tab -->
    <div class="tab-content active" id="tab-map">
        <div id="map"></div>
    </div>

    <!-- List Tab -->
    <div class="tab-content" id="tab-list">
        <div class="list-container">
            <div class="controls">
                <input type="text" id="search" placeholder="Search by name, address, area...">
                <select id="filter-area">
                    <option value="">All Areas</option>
                </select>
                <select id="filter-region">
                    <option value="">All Regions</option>
                    <option value="NoVA">NoVA</option>
                </select>
                <select id="filter-type">
                    <option value="">All Types</option>
                    <option value="high-rise">High-Rise</option>
                    <option value="mid-rise">Mid-Rise</option>
                    <option value="garden">Garden</option>
                    <option value="townhouse">Townhouse</option>
                </select>
                <select id="filter-status">
                    <option value="">All Statuses</option>
                    <option value="Not Contacted">Not Contacted</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Canvassed">Canvassed</option>
                    <option value="Declined">Declined</option>
                </select>
                <button class="btn btn-primary" onclick="exportCSV()">📥 Export CSV</button>
                <button class="btn btn-outline" onclick="resetFilters()">↻ Reset</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="name">Name <span class="sort-arrow">⇕</span></th>
                            <th data-sort="address">Address <span class="sort-arrow">⇕</span></th>
                            <th data-sort="area">Area <span class="sort-arrow">⇕</span></th>
                            <th data-sort="region">Region <span class="sort-arrow">⇕</span></th>
                            <th data-sort="est_units">Units <span class="sort-arrow">⇕</span></th>
                            <th data-sort="type">Type <span class="sort-arrow">⇕</span></th>
                            <th data-sort="status">Status <span class="sort-arrow">⇕</span></th>
                            <th>Notes</th>
                            <th>Source</th>
                        </tr>
                    </thead>
                    <tbody id="apt-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Vendor Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/map.js"></script>
    <script src="js/table.js"></script>
    <script src="js/main.js"></script>
    <script>/* LEGACY REMOVED — all JS moved to js/ modules */</script>
</body>
</html>
